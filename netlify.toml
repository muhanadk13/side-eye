# SIDE EYE — Netlify hosts the CLIENT only.
#
# The game server holds live rooms in memory and keeps a WebSocket open to every
# player. Netlify serves static files and short-lived serverless functions, so it
# cannot run it. Deploy server/ to any host that runs a persistent Node process
# (Render, Railway, Fly.io) and point VITE_SERVER_URL at it.

[build]
  base    = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: every path serves the app shell so /?room=CODE links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
